<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HomeWorks</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
    </div>
</header>
<main class="container">
    <section class="form-section">
        <h1>Get your free account</h1>
        <p>Try homeWorks BUSINESS free for 15 days. Downgrade to Basic (Free Forever) anytime.</p>
        <input type="text" class="form-input" placeholder="Full Name">
        <hr>
        <input type="text" class="form-input" placeholder="Your username">
        <hr>
        <input type="text" class="form-input" placeholder="E-mail">
        <hr>
        <input type="text" class="form-input" placeholder="Password">
        <hr>
        <input type="text" class="form-input" placeholder="Repeat Password">
        <hr>
        <div class="check-box">
            <input type="checkbox" id="agree">
            <label for="agree">Agree to our Terms of Service and Privacy Statement</label>
        </div>
        <button class="button">Sign Up</button>
        <span class="question">Already have an account?</span>
    </section>
    <section class="image-section">
        <img src="images/main-image.png" alt="HomeWorks illustration">
    </section>
</main>
<script src="scripts/script.js"></script>
</body>
</html>
